# ============================================================================
# Andarium 未签名 IPA —— iOS18 目标 + MoltenVK 路线骨架 + 可命中缓存
# 放 fork 仓库：.github/workflows/build-andarium.yml
#
# 缓存真相（先看）：
#  - GitHub 托管仓缓存上限 10GB/仓库；整套依赖前缀可能超限 → 存不下会警告并跳过保存。
#    （sources + xcframeworks + ccache 一定能存；dependencies 前缀看体积，命中就省最多）
#  - 依赖脚本用 xcrun --find clang 绝对路径，ccache 拦不住；本文件用
#    CMAKE_*_COMPILER_LAUNCHER 只给 CMake runtime 编译加速。
#  - 想“每次都省时间”最稳：改 runs-on 为自建 [self-hosted, macOS, arm64]，
#    并把 CACHE_DIR 指到本地固定目录（见 env），不受 10GB 限制。
# ============================================================================
name: Build Andarium IPA (iOS18 + MoltenVK skeleton)

on:
  workflow_dispatch: {}
  push:
    branches: [ main ]

permissions:
  contents: read

env:
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  CCACHE_MAXSIZE: 3G
  # MAX_CACHE_MB：单次允许保存的依赖前缀体积上限，超过就跳过保存（避免踩 10GB 配额）
  MAX_CACHE_MB: "8000"

jobs:
  build:
    # 自建大机器： runs-on: [self-hosted, macOS, arm64]
    runs-on: macos-15
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 1 }

      - name: Host info
        run: |
          xcodebuild -version; sw_vers
          echo "CPUs=$(sysctl -n hw.ncpu) RAM_GB=$(( $(sysctl -n hw.memsize)/1073741824 ))"; df -h /

      - name: Install build tools
        run: |
          set -eux
          brew update
          brew install cmake ninja meson pkg-config autoconf automake libtool gperf \
                       groff gettext rsync ccache python@3.12 || true
          echo "$(brew --prefix python@3.12)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix libtool)/libexec/gnubin" >> "$GITHUB_PATH"
          python3 --version; cmake --version; ccache --version | head -1

      - name: Metal toolchain (可失败)
        run: xcodebuild -downloadComponent MetalToolchain || true

      - name: Git identity
        run: |
          git config --global user.name "ci"
          git config --global user.email "ci@example.com"

      - name: Lower deployment target to 18.0
        run: sh patch-ios18.sh

      # ================= 缓存 1：依赖源码 =================
      - name: Restore deps sources
        id: c-src
        uses: actions/cache@v4
        with:
          path: .build/dependency-cache
          key: deps-src-${{ runner.os }}-${{ hashFiles('dependencies/manifest.tsv') }}
          restore-keys: deps-src-${{ runner.os }}-

      # ================= 缓存 2：依赖编译前缀（最贵，可能超限）=================
      - name: Restore deps prefixes
        id: c-prefix
        uses: actions/cache/restore@v4
        with:
          path: .build/dependencies
          key: deps-build-${{ runner.os }}-${{ hashFiles('dependencies/manifest.tsv','dependencies/*.sh','dependencies/patches/**') }}
          restore-keys: deps-build-${{ runner.os }}-

      # ================= 缓存 3：ccache =================
      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-${{ runner.os }}-${{ github.sha }}
          restore-keys: ccache-${{ runner.os }}-

      # ================= 缓存 4：SPM 依赖（libghostty-spm）=================
      - name: Restore SwiftPM caches
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            ~/Library/Developer/Xcode/DerivedData/**/SourcePackages
          key: spm-${{ runner.os }}-${{ hashFiles('Kernarium/**/Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Prepare + build dependencies (skip if cached)
        run: |
          set -eux
          for p in macos apple-gpu-vulkan-experiment ios-network ios-storage ios-compression kernel-host-tools; do
            dependencies/prepare.sh --product "$p"
          done
          GPU=".build/dependencies/apple-gpu-vulkan-experiment/ios-device-arm64"
          if [ "${{ steps.c-prefix.outputs.cache-hit }}" = "true" ] && [ -d "$GPU" ]; then
            echo ">>> [缓存命中] 依赖前缀，跳编译"
          else
            dependencies/build.sh --platform macos
            dependencies/build-apple-gpu.sh --platform ios --prefix "$PWD/$GPU"
            dependencies/build-ios-network.sh --platform ios
            dependencies/build-ios-storage.sh
            dependencies/build-ios-zstd.sh
            dependencies/build-kernel-host-tools.sh
          fi
          du -sh .build/dependencies 2>/dev/null || true

      - name: Save deps prefixes (size-guarded)
        if: always() && steps.c-prefix.outputs.cache-hit != 'true'
        run: |
          set -eux
          MB=$(du -sm .build/dependencies 2>/dev/null | awk '{print $1}')
          echo "依赖前缀体积 = ${MB:-0} MB，上限 $MAX_CACHE_MB MB"
          if [ -d ".build/dependencies" ] && [ "${MB:-0}" -le "$MAX_CACHE_MB" ]; then
            echo "SAVE=1" >> "$GITHUB_ENV"
          else
            echo ">>> 超过上限或不存在，跳过保存（不会污染缓存配额）"
            echo "SAVE=0" >> "$GITHUB_ENV"
          fi
      - name: Commit deps prefixes cache
        if: always() && steps.c-prefix.outputs.cache-hit != 'true' && env.SAVE == '1'
        uses: actions/cache/save@v4
        with:
          path: .build/dependencies
          key: deps-build-${{ runner.os }}-${{ hashFiles('dependencies/manifest.tsv','dependencies/*.sh','dependencies/patches/**') }}

      - name: Fetch Android kernel + Lineage rootfs (skip if present)
        env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: |
          set -eux
          mkdir -p .build/kernel/artifacts .build/rootfs
          [ -n "$(ls -A .build/kernel/artifacts 2>/dev/null)" ] || \
            gh release download 1.0b15-release -R imxieyi/Kernarium -p 'android-6.18-*.tar.gz' -D .build/kernel/artifacts --clobber
          [ -n "$(ls -A .build/rootfs 2>/dev/null)" ] || \
            gh release download 1.0b15-release -R imxieyi/Kernarium -p 'lineage24-*.tar.gz' -D .build/rootfs --clobber
          ls -R .build/kernel/artifacts .build/rootfs

      # ================= 缓存 5：打包好的 XCFrameworks =================
      - name: Restore XCFrameworks
        id: c-xcfw
        uses: actions/cache@v4
        with:
          path: .build/kernarium-xcframeworks
          key: xcfw-${{ runner.os }}-${{ hashFiles('CMakePresets.json','dependencies/manifest.tsv') }}
          restore-keys: xcfw-${{ runner.os }}-

      - name: Build iOS Android runtime + package frameworks (skip if cached)
        run: |
          set -eux
          if [ "${{ steps.c-xcfw.outputs.cache-hit }}" = "true" ] && [ -n "$(ls -A .build/kernarium-xcframeworks 2>/dev/null)" ]; then
            echo ">>> [缓存命中] XCFrameworks，跳过"
          else
            # runtime 编译开 ccache（这里编译器由 CMake 解析，可被 launcher 拦截）
            LAUNCH="-DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache -DCMAKE_OBJC_COMPILER_LAUNCHER=ccache -DCMAKE_OBJCXX_COMPILER_LAUNCHER=ccache"
            cmake --preset kernarium-ios-device-android $LAUNCH
            cmake --build --preset kernarium-ios-device-android
            Kernarium/scripts/package-ios-frameworks.sh --sdk device --runtimes android
          fi
          ls -1 .build/kernarium-xcframeworks

      - name: Build Andarium app (unsigned)
        run: |
          set -eux
          xcodebuild \
            -project Andarium/Andarium.xcodeproj -scheme Andarium \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" CODE_SIGN_ENTITLEMENTS="" \
            build

      - name: Package unsigned IPA
        run: |
          set -eux
          APP="$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' | head -1)"
          test -n "$APP" || { echo '未生成 .app'; ls -R build/Build/Products || true; exit 1; }
          rm -rf out && mkdir -p out/Payload && cp -R "$APP" out/Payload/
          ( cd out && zip -qry "$GITHUB_WORKSPACE/Andarium-unsigned.ipa" Payload )
          shasum -a 256 Andarium-unsigned.ipa; ls -lh Andarium-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Andarium-unsigned-ipa
          path: Andarium-unsigned.ipa
          if-no-files-found: error
